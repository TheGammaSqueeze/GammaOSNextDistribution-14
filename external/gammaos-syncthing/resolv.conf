# GammaOS: resolver configuration for statically linked Go programs (Syncthing).
# bionic does not read this file; Android resolves through netd. Go's pure resolver only reads
# /etc/resolv.conf, and without one it tries localhost:53 and fails, which breaks Syncthing's
# global discovery and relay lookups. Public resolvers are used because the network's own DNS
# servers are not exposed as a file on Android.
nameserver 1.1.1.1
nameserver 8.8.8.8
nameserver 2606:4700:4700::1111
nameserver 2001:4860:4860::8888
options timeout:3 attempts:2
